<!DOCTYPE html><html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>BlackLogic Technologies</title>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
<style>
  * { margin:0; padding:0; box-sizing:border-box; font-family:'Poppins', sans-serif; }
  body { background:#000; color:#fff; overflow-x:hidden; }/* Banner */ .banner { width:100%; height:300px; background: url('logicH.jpg') center/cover no-repeat; }

/* Video Section */ .video-section { text-align:center; padding:40px 20px; } .video-section h2 { color:#00ffff; font-size:2rem; margin-bottom:20px; } .video-container { position:relative; width:100%; max-width:800px; margin:0 auto; padding-bottom:56.25%; height:0; overflow:hidden; border:2px solid #00ffff; border-radius:12px; } .video-container iframe { position:absolute; top:0; left:0; width:100%; height:100%; border:0; }

/* Pricing Images */ .pricing-section { display:grid; grid-template-columns: repeat(auto-fit,minmax(280px,1fr)); gap:30px; padding:40px 20px; max-width:1000px; margin:0 auto; } .pricing-card { height:300px; width:100%; border-radius:12px; overflow:hidden; position:relative; border:2px solid #00ffff; animation: breathe 3s infinite; } .pricing-card img { width:100%; height:100%; object-fit:cover; display:block; } @keyframes breathe { 0%,100%{transform:scale(1); opacity:1;} 50%{transform:scale(1.05); opacity:0.9;} }

/* Side Drawer */ .hamburger { position:fixed; top:20px; left:20px; font-size:2rem; color:#00ffff; cursor:pointer; z-index:1001; } .side-drawer { position:fixed; top:0; left:-250px; width:250px; height:100%; background:#111; padding-top:60px; transition: left 0.3s ease; z-index:1000; } .side-drawer a { display:flex; align-items:center; padding:15px 20px; color:#ccc; text-decoration:none; font-size:1rem; transition:0.3s; } .side-drawer a i { margin-right:15px; font-size:1.2rem; } .side-drawer a:hover { color:#00ffff; } .drawer-open { left:0; }

@media(max-width:500px){ .video-section h2{font-size:1.5rem;} .pricing-section { padding:20px 10px; } .pricing-card { height:200px; } } </style>

</head>
<body><!-- Hamburger Menu --><div class="hamburger" id="hamburger"><i class="fas fa-bars"></i></div>
<nav class="side-drawer" id="sideDrawer">
  <a href="index.html"><i class="fas fa-home"></i>Home</a>
  <a href="product.html"><i class="fas fa-box"></i>Products</a>
  <a href="apps.html"><i class="fas fa-star"></i>Top 5 Apps</a>
  <a href="about.html"><i class="fas fa-user"></i>About Us</a>
  <a href="consult.html"><i class="fas fa-comments"></i>Consult Us</a>
</nav><!-- Banner --><section class="banner"></section><!-- Video Section --><section class="video-section">
  <h2>Who We Are</h2>
  <div class="video-container">
    <iframe src="https://www.youtube.com/embed/FK5Hijigklw" 
            title="BlackLogic Intro Video" 
            allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture" 
            allowfullscreen>
    </iframe>
  </div>
</section><!-- Pricing Images --><section class="pricing-section">
    <h2>Our Prices</h2>
  <div class="pricing-card"><img src="price1.jpg" alt="Price 1"></div>
  <div class="pricing-card"><img src="price2.jpg" alt="Price 2"></div>
  <div class="pricing-card"><img src="price3.jpg" alt="Price 3"></div>
</section><script>
  const hamburger = document.getElementById('hamburger');
  const sideDrawer = document.getElementById('sideDrawer');

  hamburger.addEventListener('click', ()=>{
    sideDrawer.classList.toggle('drawer-open');
  });
</script></body>
</html>
