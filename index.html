<!DOCTYPE html><html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>BlackLogic Technologies</title>
    <style>
        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background: #000;
            color: #00ffff;
        }
        .banner {
            width: 100%;
            height: 300px;
            background-image: url('dubai.jpg');
            background-size: cover;
            background-position: center;
        }
        .intro {
            text-align: center;
            padding: 20px 10px;
        }
        .intro h1, .intro p {
            color: #00ffff;
        }
        .grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(280px, 1fr));
            gap: 20px;
            padding: 20px;
        }
        .card {
            background: #000;
            border: 2px solid #00ffff;
            border-radius: 12px;
            overflow: hidden;
            box-shadow: 0 4px 10px rgba(0,255,255,0.2);
            text-align: center;
            transition: transform 0.3s ease, opacity 0.3s ease;
            opacity: 0.95;
        }
        .card:hover {
            transform: translateY(-10px);
            opacity: 1;
            box-shadow: 0 0 20px #00ffff;
        }
        .card img {
            width: 100%;
            height: 250px;
            object-fit: cover;
        }
        .card .icon {
            font-size: 40px;
            margin-top: 15px;
            color: #00ffff;
        }
        .card h3 {
            margin-top: 10px;
            font-size: 20px;
            color: #00ffff;
        }
        .enter-btn-container {
            text-align: center;
            padding: 30px;
        }
        .enter-btn {
            display: inline-block;
            padding: 12px 25px;
            background: #fff;
            color: #000;
            border-radius: 8px;
            text-decoration: none;
            font-size: 18px;
            font-weight: bold;
        }
        .enter-btn:hover {
            background: #00ffff;
            color: #000;
        }
    </style>
</head>
<body><div class="banner"></div>

<div class="intro">
    <h1>BlackLogic Technologies is the Home of Innovation and Technologies</h1>
    <p>Here are some of our specializations</p>
</div>

<div class="grid">
    <div class="card">
        <img src="software.jpg" alt="Software Development" />
        <div class="icon">💻</div>
        <h3>Software Development</h3>
    </div>

    <div class="card">
        <img src="Site.jpg" alt="Construction Technology" />
        <div class="icon">🏗️</div>
        <h3>Mkholo Ecosystem Construction Tech</h3>
    </div>

    <div class="card">
        <img src="restaurant.jpg" alt="Mamzo Lifestyles" />
        <div class="icon">🍽️</div>
        <h3>Mamzo Lifestyles – Food & Delivery</h3>
    </div>
</div>

<div class="enter-btn-container">
    <a href="landing.html" class="enter-btn">ENTER</a>
</div>

</body>
</html>
